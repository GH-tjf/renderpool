[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "renderpool"
version = "0.1.0"
description = "RenderPool: one queue and load balancer for every Stable Diffusion WebUI (A1111) API image generator you own - AUTOMATIC1111, Forge, SD.Next, Draw Things, KoboldCpp, stable-diffusion.cpp"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "GH-tjf"}]
keywords = ["stable-diffusion", "automatic1111", "a1111", "stable-diffusion-webui", "sd-webui-forge", "sdnext",
            "draw-things", "koboldcpp", "stable-diffusion-cpp", "flux", "image-generation", "render-farm",
            "render-queue", "job-queue", "load-balancer", "gpu-pool", "apple-silicon", "nvidia", "amd", "intel-arc"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
]
dependencies = []

# [project.urls] Homepage / Issues: fill in once the GitHub repository exists.

[project.scripts]
renderpool = "renderpool.renderpool:cli"

# The source keeps its flat layout (python3 renderpool.py works from a clone); installed, it becomes the
# renderpool package. renderpool.py puts its own folder on sys.path, so `import boxes` / `engines` resolve there.
[tool.setuptools]
packages = ["renderpool", "renderpool.engines"]
include-package-data = false

[tool.setuptools.package-dir]
renderpool = "."
"renderpool.engines" = "engines"

[tool.setuptools.package-data]
renderpool = ["static/index.html", "config.example.json"]
